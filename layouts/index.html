{{ define "title" }}{{ .Title }}{{ end }}

{{ define "main" }}
  {{ .Content }}
  
  <section class="recent-section">
    <div class="section-heading">
      <h2>Recent</h2>
      <a href="/news/">News archive</a>
    </div>
    <div class="recent-list">
    {{ range first 5 (where .Site.RegularPages "Section" "news") }}
      <article class="recent-item">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </article>
    {{ end }}
    </div>
    <p class="writing-link">Longer technical notes and visual explanations live under <a href="/blog/">Writing</a>.</p>
  </section>
{{ end }}

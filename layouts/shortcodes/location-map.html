{{ $name := .Get "name" | default (.Page.Params.location.name) }}
{{ $coords := .Get "coords" | default (.Page.Params.location.coords) }}
{{ $zoom := .Get "zoom" | default (.Page.Params.location.zoom) | default 13 }}

{{ if $coords }}
<div class="conference-location">
  <p><strong>{{ $name }}</strong> · <a href="https://www.google.com/maps?q={{ $coords }}&z={{ $zoom }}" target="_blank" rel="noopener noreferrer">View on Google Maps</a></p>
</div>
{{ end }}
